{% extends "base.html" %}
{% block title %}Create account — FindIt{% endblock %}
{% block content %}<section class="card auth-card"><p class="eyebrow">JOIN FINDIT</p><h1>Stay connected.</h1><p class="lede">Any email address works. A college email is recommended.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="10" required></label><button>Create account</button></form><p>Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p></section>{% endblock %}

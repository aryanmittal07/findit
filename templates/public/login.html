{% extends "base.html" %}
{% block title %}Sign in — FindIt{% endblock %}
{% block content %}<section class="card auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p>New to FindIt? <a href="{{ url_for('signup') }}">Create an account</a>.</p></section>{% endblock %}

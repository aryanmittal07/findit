services:
  - type: web
    name: findit
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FINDIT_DATA_DIR
        value: /var/data
    disk:
      name: findit-data
      mountPath: /var/data
      sizeGB: 1
